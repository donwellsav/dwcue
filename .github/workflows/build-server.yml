name: Build Server (C++)

# Runs the C++ build on every push/PR that touches the server, plus manually
# via the Actions tab. Matrix: Windows MSVC, macOS Clang, Ubuntu GCC.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSVC)
            triplet: x64-windows
            cmake_args: ""
            artifact_name: dwcue-server-windows-x64
            binary_glob: |
              server/build/Release/dwcue-server.exe
              server/build/dwcue-server.exe
          - os: macos-latest
            label: macOS Apple Silicon (Clang)
            triplet: arm64-osx-dwcue
            cmake_args: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
            artifact_name: dwcue-server-macos-arm64
            binary_glob: |
              server/build/dwcue-server
          - os: ubuntu-latest
            label: Linux (GCC)
            triplet: x64-linux
            cmake_args: ""
            artifact_name: dwcue-server-linux-x64
            binary_glob: |
              server/build/dwcue-server

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runners ship vcpkg pre-installed at VCPKG_INSTALLATION_ROOT.
      # We re-export it as VCPKG_ROOT so CMake's toolchain dance picks it up.
      - name: Export VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # Cache vcpkg's binary archive directory across runs of the same OS.
      # x-gha binary source is the official GHA cache integration.
      - name: Configure vcpkg GHA cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ------------------------------------------------------------------
      # Platform-specific system dependencies
      # ------------------------------------------------------------------
      - name: Install Linux audio dev packages
        if: runner.os == 'Linux'
        run: |
          # The GitHub-hosted runners ship extra Microsoft apt repos
          # (azure-cli, packages.microsoft.com/prod) that we don't use and that
          # intermittently serve a broken/unsigned InRelease file, which makes
          # `apt-get update` fail with exit code 100. Drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            nasm \
            pkg-config \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev \
            libx11-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------------
      # Configure & build
      # ------------------------------------------------------------------
      - name: CMake configure
        working-directory: server
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DLIVEPLAY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            ${{ matrix.cmake_args }}

      - name: CMake build
        working-directory: server
        run: cmake --build build --config Release -j

      - name: CTest
        working-directory: server
        run: ctest --test-dir build --build-config Release --output-on-failure

      # ------------------------------------------------------------------
      # Smoke test — the banner should print without crashing.
      # `--help` is wired up in main.cpp and exits 0 cleanly.
      # ------------------------------------------------------------------
      - name: Smoke test (--help)
        if: runner.os != 'Windows'
        working-directory: server
        run: ./build/dwcue-server --help

      - name: Smoke test (--help) Windows
        if: runner.os == 'Windows'
        working-directory: server
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter dwcue-server.exe | Select-Object -First 1
          if (-not $exe) { throw "dwcue-server.exe not found" }
          & $exe.FullName --help

      # ------------------------------------------------------------------
      # Stage and upload artefacts
      # ------------------------------------------------------------------
      - name: Stage artefact
        shell: bash
        run: |
          mkdir -p artifact
          # Copy whichever build/<config>/dwcue-server[.exe] exists.
          if [ -f "server/build/Release/dwcue-server.exe" ]; then
            cp "server/build/Release/dwcue-server.exe" artifact/
          elif [ -f "server/build/dwcue-server.exe" ]; then
            cp "server/build/dwcue-server.exe" artifact/
          elif [ -f "server/build/dwcue-server" ]; then
            cp "server/build/dwcue-server" artifact/
          else
            echo "::error::No dwcue-server binary found under server/build/"
            ls -lR server/build || true
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            find server/build -maxdepth 1 -type f -name '*.dll' -exec cp {} artifact/ \;
            vcpkg_bin="server/build/vcpkg_installed/${{ matrix.triplet }}/bin"
            if [ -d "$vcpkg_bin" ]; then
              find "$vcpkg_bin" -maxdepth 1 -type f -name '*.dll' -exec cp {} artifact/ \;
            fi
          fi
          cp server/README.md artifact/README.md
          cp LICENCE.txt artifact/LICENCE.txt
          cp server/assets/TimGM6mb.sf2 artifact/
          cp server/assets/TimGM6mb.NOTICE.md artifact/
          cp server/assets/TimGM6mb.GPL-2.0.txt artifact/
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C artifact .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          retention-days: 14
