name: Deploy Docs Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      # Node 20 bundles npm 10.8.x, which crashes with "Cannot read properties
      # of null (reading 'edgesOut')" when resolving Nuxt's platform-gated
      # optional deps (oxc bindings). npm 11 fixes it. Pinned to 11 because
      # npm@latest (12.x) requires Node 22+.
      - name: Update npm
        run: npm install -g npm@11

      # docs-site is NOT part of the root workspaces list, so npm's prefix
      # stays here and it reads docs-site/package-lock.json.
      - name: Install dependencies
        working-directory: ./docs-site
        shell: bash
        run: npm ci --include=optional

      - name: Copy additional files
        run: |
          # Copy README for reference
          cp README.md docs-site/public/README.md
          # Copy package.json for version info
          cp package.json docs-site/public/package.json

      - name: Build static site
        working-directory: ./docs-site
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/.output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
