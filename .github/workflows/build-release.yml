name: Build and Release

# Cuts a release whenever the monorepo root version (package.json) changes on
# main. Builds the C++ server and the Electron client together on each
# platform — Windows x64, macOS arm64 + Intel x64, and Linux x64 — and
# publishes a single GitHub Release with all installers.
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated installers as a GitHub Release
        required: true
        default: false
        type: boolean

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=v${CURRENT_VERSION}" >> $GITHUB_OUTPUT

          # workflow_dispatch always runs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch — building ${CURRENT_VERSION}"
            exit 0
          fi

          git diff HEAD^ HEAD -- package.json > package_diff.txt
          if grep -q '"version"' package_diff.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed to ${CURRENT_VERSION}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            triplet: x64-windows
            artifact_name: windows-build
            electron_args: --win --x64 --publish never
            cmake_args: ""
          - os: ubuntu-latest
            label: Linux x64
            triplet: x64-linux
            artifact_name: linux-build
            electron_args: --linux --x64 --publish never
            cmake_args: ""
          - os: macos-15
            label: macOS Apple Silicon (arm64)
            triplet: arm64-osx-dwcue
            artifact_name: macos-arm64-build
            electron_args: --mac --arm64 --publish never
            mac_arch: arm64
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
          - os: macos-15-intel
            label: macOS Intel (x64)
            triplet: x64-osx-dwcue
            artifact_name: macos-x64-build
            electron_args: --mac --x64 --publish never
            mac_arch: x64
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
            # The Intel runner hangs inside the smoke test's osascript window
            # probe (ETIMEDOUT) while the app itself validates fine. Keep the
            # leg best-effort so it can't block releases of the three proven
            # platforms; its artifacts join the release automatically once the
            # probe stops hanging. None of the historical releases shipped x64.
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    # Only the Intel leg sets continue-on-error in its matrix entry; every
    # other leg evaluates to false and remains release-blocking.
    continue-on-error: ${{ matrix.continue-on-error == true }}

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # C++ server toolchain — must build before the client so
      # electron-builder's extraResources can pick up the binary.
      # -------------------------------------------------------------------
      - name: Export VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure vcpkg GHA cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux audio dev packages
        if: runner.os == 'Linux'
        run: |
          # The GitHub-hosted runners ship extra Microsoft apt repos
          # (azure-cli, packages.microsoft.com/prod) that we don't use and that
          # intermittently serve a broken/unsigned InRelease file, which makes
          # `apt-get update` fail with exit code 100. Drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm pkg-config autoconf autoconf-archive automake libtool \
            libasound2-dev libpulse-dev libjack-jackd2-dev libx11-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install nasm ninja pkg-config

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build C++ server
        shell: bash
        run: |
          cmake -S server -B server/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DLIVEPLAY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            ${{ matrix.cmake_args }}
          cmake --build server/build --config Release -j
          ctest --test-dir server/build --build-config Release --output-on-failure

      - name: Stage server binary for electron-builder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ninja produces a single-config build; electron-builder expects
          # the Release sub-directory layout used by the multi-config preset.
          New-Item -ItemType Directory -Force "server/build/Release" | Out-Null
          if (-not (Test-Path "server/build/dwcue-server.exe")) {
            throw "server/build/dwcue-server.exe not found"
          }
          Copy-Item "server/build/dwcue-server.exe" "server/build/Release/" -Force
          @(
            "server/build",
            "server/build/vcpkg_installed/${{ matrix.triplet }}/bin"
          ) | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem $_ -File -Filter "*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName "server/build/Release/" -Force }
          }
          & "server/build/Release/dwcue-server.exe" --help

      # -------------------------------------------------------------------
      # Client (Nuxt + Electron)
      # -------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Node 20 bundles npm 10.8.x, which crashes with "Cannot read properties
      # of null (reading 'edgesOut')" while resolving the platform-gated
      # optional deps Nuxt pulls in (oxc/rollup bindings). npm 11 fixes it.
      # Pinned to 11 because npm@latest (12.x) requires Node 22+.
      - name: Update npm
        run: npm install -g npm@11

      # Installed from the repo root: client is an npm workspace, so npm
      # resolves its prefix to the root regardless of the cwd, and the root
      # package-lock.json is the one it reads. That lockfile carries every
      # platform's optional binaries, so all three matrix targets resolve.
      - name: Install dependencies
        shell: bash
        run: npm ci --include=optional
        env:
          CI: true

      - name: Type-check client
        run: npm run typecheck --workspace=client

      - name: Build Nuxt application
        working-directory: client
        run: npm run build

      # electron-builder downloads the Electron binary + code-signing helpers
      # from GitHub at build time. Cache them so a transient DNS/network blip
      # (e.g. "lookup github.com: no such host") doesn't have to re-fetch.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ matrix.triplet }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-electron-

      - name: Configure available Windows signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            printf 'CSC_LINK=%s\nCSC_KEY_PASSWORD=%s\n' \
              "$WIN_CSC_LINK" "$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Configure macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        # Maps the MAC_CSC_* secrets to electron-builder's CSC_* variables and
        # arms the signing path (electron-builder.config.js reads MAC_SIGNING).
        # Absent secrets keep macOS builds ad-hoc signed, e.g. on forks.
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            printf 'CSC_LINK=%s\nCSC_KEY_PASSWORD=%s\nMAC_SIGNING=true\n' \
              "$MAC_CSC_LINK" "$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build Electron app
        working-directory: client
        shell: bash
        # Retry to ride out transient network failures while electron-builder
        # downloads the Electron binary from GitHub.
        run: |
          # macOS: point electron-builder at electron-builder.config.js so the
          # MAC_SIGNING env switch applies (config-file auto-discovery is not
          # relied upon — the package.json "build" field otherwise wins).
          cfg=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            cfg=(--config electron-builder.config.js)
          fi
          for attempt in 1 2 3; do
            echo "electron:build attempt $attempt"
            if npm run electron:build -- "${cfg[@]}" ${{ matrix.electron_args }}; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "electron:build failed after 3 attempts" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Validate packaged macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(client/dist-electron/*.dmg)
          if [ "${#dmg_files[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS DMG, found ${#dmg_files[@]}" >&2
            exit 1
          fi

          hdiutil verify "${dmg_files[0]}"
          mac_mount_dir=$(mktemp -d "$RUNNER_TEMP/dwcue-dmg.XXXXXX")
          cleanup_mac_mount() {
            hdiutil detach "$mac_mount_dir" >/dev/null 2>&1 || true
            rmdir "$mac_mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mac_mount EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mac_mount_dir" "${dmg_files[0]}" >/dev/null
          mac_app="$mac_mount_dir/DonWells Cue.app"
          test -f "$mac_app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=4 "$mac_app"
          if [ "${MAC_SIGNING:-}" = "true" ]; then
            codesign -dv --verbose=4 "$mac_app" 2>&1 | grep -q '^Authority=Developer ID Application: '
            spctl -a -vv "$mac_app" 2>&1 | grep -q 'source=Notarized Developer ID'
          else
            codesign -dv --verbose=4 "$mac_app" 2>&1 | grep -q '^Signature=adhoc$'
          fi
          codesign -dv --verbose=4 "$mac_app" 2>&1 | grep -q '^Identifier=com.donwells.cue$'
          expected_arch='${{ matrix.mac_arch }}'
          expected_macho_arch="$expected_arch"
          if [ "$expected_arch" = x64 ]; then expected_macho_arch=x86_64; fi
          app_archs=$(lipo -archs "$mac_app/Contents/MacOS/DonWells Cue")
          test "$app_archs" = "$expected_macho_arch"
          server_archs=$(lipo -archs "$mac_app/Contents/Resources/server-bin/dwcue-server")
          test "$server_archs" = "$expected_macho_arch"

          node scripts/smoke-packaged-app-mac.js --arch "$expected_arch"

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unpacked = "client/dist-electron/win-unpacked"
          $app = Join-Path $unpacked "DonWells Cue.exe"
          $server = Join-Path $unpacked "resources/server-bin/dwcue-server.exe"
          $soundfont = Join-Path $unpacked "resources/server-bin/TimGM6mb.sf2"
          foreach ($required in @($app, $server, $soundfont)) {
            if (-not (Test-Path $required)) { throw "Packaged file missing: $required" }
          }

          # Starting the bundled server here catches missing app-local DLLs.
          & $server --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged server failed with exit code $LASTEXITCODE" }

          $process = Start-Process -FilePath $app -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged app exited during startup with code $($process.ExitCode)"
              }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) {
              throw "Packaged app did not create a Windows desktop window"
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Collect installers into /build/
        shell: bash
        run: |
          mkdir -p build
          shopt -s nullglob
          # Both macOS jobs generate `latest-mac.yml`. Namespace the disabled
          # updater manifests before artifact upload so the Intel and arm64
          # jobs cannot overwrite one another in the release job.
          if [ "${{ runner.os }}" = "macOS" ] && [ -f client/dist-electron/latest-mac.yml ]; then
            mv client/dist-electron/latest-mac.yml "client/dist-electron/latest-mac-${{ matrix.mac_arch }}.yml"
          fi
          # Copy installer artefacts only (skip unpacked dirs / debug yaml).
          for f in client/dist-electron/*.exe \
                   client/dist-electron/*.exe.blockmap \
                   client/dist-electron/*.dmg \
                   client/dist-electron/*.dmg.blockmap \
                   client/dist-electron/*.zip \
                   client/dist-electron/*.zip.blockmap \
                   client/dist-electron/*.AppImage \
                   client/dist-electron/*.deb \
                   client/dist-electron/*.rpm \
                   client/dist-electron/latest*.yml; do
            [ -e "$f" ] && cp "$f" build/
          done
          ls -la build/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/*
          retention-days: 5

  release:
    needs: [check-version, build]
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # PAT with contents:write on donwellsav/homebrew-tap; when absent the
      # tap-update step skips quietly and the release proceeds normally.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Cloudflare API token (Workers R2 Storage:Edit) + account ID used to
      # push the macOS downloads to dwcue.com; when absent that step skips.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./artifacts

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-build
          path: ./artifacts

      - name: Download macOS Intel artifacts
        # The Intel build leg is continue-on-error (see matrix); when it
        # fails there is no macos-x64-build artifact, and the release must
        # still proceed arm64-only — exactly like every historical release.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-build
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lR ./artifacts

      # Make the update manifests authoritative. electron-updater downloads the
      # installer, hashes it, and aborts with a checksum error if it disagrees
      # with latest*.yml. We've seen the published mac .zips drift from the hash
      # electron-builder recorded (a constant byte offset applied after hashing),
      # which breaks Mac auto-update outright. Rather than trust whatever hashes
      # the build wrote, recompute every sha512/size/blockMapSize here from the
      # exact bytes we're about to publish — so the manifest can never disagree
      # with the binaries, on any platform.
      - name: Rewrite latest*.yml checksums from published files
        run: |
          set -euo pipefail
          # Drop the runner's flaky pre-installed Microsoft apt repos (see the
          # Linux build step) so `apt-get update` can't fail with exit code 100.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          python3 - <<'PY'
          import os, glob, hashlib, base64, yaml

          ART = "artifacts"

          def sha512_b64(path):
              h = hashlib.sha512()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return base64.b64encode(h.digest()).decode()

          for yml in sorted(glob.glob(os.path.join(ART, "latest*.yml"))):
              with open(yml) as fh:
                  doc = yaml.safe_load(fh)
              files = doc.get("files", [])
              for fi in files:
                  fp = os.path.join(ART, fi["url"])
                  if not os.path.exists(fp):
                      raise SystemExit(f"{yml}: referenced file missing: {fi['url']}")
                  fi["sha512"] = sha512_b64(fp)
                  fi["size"] = os.path.getsize(fp)
                  # Differential downloads read blockMapSize; keep it truthful too.
                  if "blockMapSize" in fi and os.path.exists(fp + ".blockmap"):
                      fi["blockMapSize"] = os.path.getsize(fp + ".blockmap")
              # The top-level path/sha512 must mirror its files[] entry.
              top = doc.get("path")
              match = next((f for f in files if f["url"] == top), None) if top else None
              if match:
                  doc["sha512"] = match["sha512"]
              with open(yml, "w") as fh:
                  yaml.safe_dump(doc, fh, default_flow_style=False, sort_keys=False)
              print(f"Rewrote {os.path.basename(yml)}:")
              for fi in files:
                  print(f"  {fi['url']}  size={fi['size']}  sha512={fi['sha512'][:16]}...")
          PY

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          {
            echo "## What's Changed"
            echo ""
            git log ${COMMIT_RANGE} --pretty=format:"- %s (%an)" --no-merges
            echo ""
            echo ""
            echo "## Statistics"
            echo ""
            echo "- **Commits**: $(git rev-list --count ${COMMIT_RANGE})"
            echo "- **Contributors**: $(git log ${COMMIT_RANGE} --format='%an' --no-merges | sort -u | wc -l)"
            LANG_COUNT=$(find client/locales -name "*.json" -type f | wc -l)
            echo "- **Supported Languages**: ${LANG_COUNT}"
          } > CHANGELOG.md

          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: DonWells Cue ${{ needs.check-version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cask in donwellsav/homebrew-tap pins version + sha256 of each
      # published DMG. Regenerate it from the exact bytes just released so the
      # tap can never drift from the GitHub Release. Skips quietly when the
      # HOMEBREW_TAP_TOKEN secret is not configured.
      - name: Update Homebrew tap cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/donwellsav/homebrew-tap.git" \
            tap-checkout
          mkdir -p tap-checkout/Casks

          python3 - <<'PY'
          import glob, hashlib, os

          version = os.environ["RELEASE_TAG"].lstrip("v")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          dmgs = {os.path.basename(p): sha256(p) for p in glob.glob("artifacts/*.dmg")}
          arm = next((v for k, v in dmgs.items() if k.endswith("-arm64.dmg")), None)
          intel = next((v for k, v in dmgs.items() if k.endswith("-x64.dmg")), None)
          if arm is None:
              raise SystemExit(f"No arm64 DMG among release artifacts: {sorted(dmgs)}")

          head = f'''cask "donwells-cue" do
            version "{version}"
          '''
          if intel:
              head += f'''  arch arm: "arm64", intel: "x64"
            sha256 arm:   "{arm}",
                   intel: "{intel}"

            url "https://github.com/donwellsav/dwcue/releases/download/v#{{version}}/DonWells-Cue-#{{version}}-#{{arch}}.dmg"
          '''
              arch_dep = ""
          else:
              head += f'''  sha256 "{arm}"

            url "https://github.com/donwellsav/dwcue/releases/download/v#{{version}}/DonWells-Cue-#{{version}}-arm64.dmg"
          '''
              arch_dep = "  depends_on arch: :arm64\n"

          cask = head + '''
            name "DonWells Cue"
            desc "Audio cue playback application for live sound operators"
            homepage "https://github.com/donwellsav/dwcue"

            livecheck do
              url :url
              strategy :github_latest
            end

            # minimumSystemVersion in the app's Info.plist is 13.3.
            depends_on macos: :ventura
          ''' + arch_dep + '''
            app "DonWells Cue.app"

            zap trash: [
              "~/Library/Application Support/LivePlay",
              "~/Library/Caches/com.donwells.cue",
              "~/Library/Preferences/com.donwells.cue.plist",
              "~/Library/Saved Application State/com.donwells.cue.savedState",
            ]

            caveats <<~EOS
              DonWells Cue is currently unsigned and not notarized (see SIGNING.md in the
              source repo). If Gatekeeper blocks the first launch with "damaged" or
              "cannot be opened", run:

                xattr -dr com.apple.quarantine "/Applications/DonWells Cue.app"
            EOS
          end
          '''

          with open("tap-checkout/Casks/donwells-cue.rb", "w") as fh:
              fh.write(cask)
          print(cask)
          PY

          cd tap-checkout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/donwells-cue.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date for ${RELEASE_TAG}"
            exit 0
          fi
          git commit -m "donwells-cue ${RELEASE_TAG}"
          git push

      # dwcue.com is served by the dwcue-web Worker out of the R2 bucket
      # dwcue-site (binding env.SITE). Workers static assets cap at 25 MiB,
      # so the macOS installers live in R2 as downloads/<filename>; upload
      # each DMG/ZIP with the same content headers the dashboard used. The
      # glob is pinned to the macOS -arm64/-x64 names on purpose: the global
      # artifactName (DonWells-Cue-<ver>-<arch>.<ext>) means a future Windows
      # zip target would collide with the Intel macOS zip's R2 key.
      # Skips quietly when CLOUDFLARE_API_TOKEN is not configured.
      - name: Upload macOS downloads to dwcue.com (R2)
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/DonWells-Cue-*-arm64.dmg artifacts/DonWells-Cue-*-arm64.zip \
                 artifacts/DonWells-Cue-*-x64.dmg artifacts/DonWells-Cue-*-x64.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS DMG/ZIP artifacts found; skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            base=$(basename "$f")
            case "$base" in
              *.dmg) mime="application/x-apple-diskimage" ;;
              *.zip) mime="application/zip" ;;
            esac
            echo "Uploading $base -> dwcue-site/downloads/$base"
            npx --yes wrangler@4 r2 object put "dwcue-site/downloads/$base" \
              --remote --file "$f" \
              --content-type "$mime" \
              --content-disposition "attachment; filename=\"$base\"" \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Update latest release
        run: |
          echo "Release ${{ needs.check-version.outputs.version }} published successfully!"
          echo "Download at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.version }}"
